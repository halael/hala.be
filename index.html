<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALA</title>
<link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet'>
<style>
* { margin: 0; padding: 0; }
body { 
  overflow: hidden; 
  background: #fff;
}
#hala {
  font-family: 'Lato', sans-serif;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: 15px;
  color: #D26;
  z-index: 10;
  pointer-events: none;
}
#hala a {
  pointer-events: all;
}
a { 
  color: #D26; 
  text-decoration: none;
  transition: color 0.3s;
}
a:hover { color: #d03568; }
canvas { 
  display: block;
  cursor: crosshair;
}
</style>
</head>
<body>
<div id="hala"><a href="https://twitter.com/halae">HALA</a></div>
<canvas id="projector"></canvas>
<script>
// Original experiment: http://hakim.se/experiments/html5/particles/01/
// Enhanced version

const CONFIG = {
  VELOCITY: 0.2,
  PARTICLE_DENSITY: 0.0001,
  MAX_SIZE: 4,
  MIN_SIZE: 1,
  BOUNCE_DAMPING: 0.002,
  CONNECTION_DISTANCE: 100,
  MOUSE_INFLUENCE: 150,
  MOUSE_STRENGTH: 0.3
};

const colors = ["#8cc356","#6bab2d","#2dab98","#ddc922","#3597d0","#d03568"];
const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('projector');
const context = canvas.getContext('2d');
const particles = [];
const mouse = { x: null, y: null };
let isVisible = true;

// Adjust settings for performance and accessibility
if (isMobile) {
  CONFIG.PARTICLE_DENSITY = 0.00005;
  CONFIG.CONNECTION_DISTANCE = 60;
}
if (prefersReducedMotion) {
  CONFIG.VELOCITY = 0.1;
  CONFIG.PARTICLE_DENSITY = 0.00005;
}

function initParticles() {
  particles.length = 0;
  const particleCount = Math.floor(canvas.width * canvas.height * CONFIG.PARTICLE_DENSITY);
  
  for(let i = 0; i < particleCount; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() * (CONFIG.VELOCITY * 2)) - CONFIG.VELOCITY,
      vy: (Math.random() * (CONFIG.VELOCITY * 2)) - CONFIG.VELOCITY,
      size: CONFIG.MIN_SIZE + Math.random() * (CONFIG.MAX_SIZE - CONFIG.MIN_SIZE),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initParticles();
}

function updateParticle(p) {
  // Mouse interaction
  if (mouse.x !== null && mouse.y !== null) {
    const dx = mouse.x - p.x;
    const dy = mouse.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < CONFIG.MOUSE_INFLUENCE) {
      const force = (CONFIG.MOUSE_INFLUENCE - dist) / CONFIG.MOUSE_INFLUENCE;
      p.vx -= (dx / dist) * force * CONFIG.MOUSE_STRENGTH;
      p.vy -= (dy / dist) * force * CONFIG.MOUSE_STRENGTH;
    }
  }
  
  // Update position
  p.x += p.vx;
  p.y += p.vy;
  
  // Boundary collision with velocity adjustment
  if (p.x > canvas.width) {
    p.vx = -CONFIG.VELOCITY - Math.random() * CONFIG.VELOCITY;
  } else if (p.x < 0) {
    p.vx = CONFIG.VELOCITY + Math.random() * CONFIG.VELOCITY;
  }
  
  if (p.y > canvas.height) {
    p.vy = -CONFIG.VELOCITY - Math.random() * CONFIG.VELOCITY;
  } else if (p.y < 0) {
    p.vy = CONFIG.VELOCITY + Math.random() * CONFIG.VELOCITY;
  }
  
  // VELOCITY LIMITER - keeps speed constant
  const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  const maxSpeed = CONFIG.VELOCITY * 2;
  
  if (speed > maxSpeed) {
    p.vx = (p.vx / speed) * maxSpeed;
    p.vy = (p.vy / speed) * maxSpeed;
  }
}

function drawConnections() {
  if (isMobile || prefersReducedMotion) return;
  
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const p1 = particles[i];
      const p2 = particles[j];
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < CONFIG.CONNECTION_DISTANCE) {
        const opacity = (1 - dist / CONFIG.CONNECTION_DISTANCE) * 0.3;
        context.strokeStyle = `rgba(140, 195, 86, ${opacity})`;
        context.lineWidth = 0.5;
        context.beginPath();
        context.moveTo(p1.x, p1.y);
        context.lineTo(p2.x, p2.y);
        context.stroke();
      }
    }
  }
}

function drawParticle(p) {
  context.fillStyle = p.color;
  context.beginPath();
  context.arc(p.x, p.y, p.size, 0, Math.PI * 2);
  context.fill();
}

function animate() {
  if (!isVisible) return;
  
  context.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw connections first (behind particles)
  drawConnections();
  
  // Update and draw particles
  particles.forEach(p => {
    updateParticle(p);
    drawParticle(p);
  });
  
  requestAnimationFrame(animate);
}

// Event listeners
window.addEventListener('resize', resize);

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener('mouseleave', () => {
  mouse.x = null;
  mouse.y = null;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: false });

canvas.addEventListener('touchend', () => {
  mouse.x = null;
  mouse.y = null;
});

document.addEventListener('visibilitychange', () => {
  isVisible = !document.hidden;
  if (isVisible) animate();
});

// Initialize
resize();
animate();
</script>
</body>
</html>

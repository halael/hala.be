 <link href='http://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
 <style >
 #hala {
 font-family: 'Lato', sans-serif;

    top: 50%;

    width:100px;

 </style>

<body style="overflow:hidden">
 <div id="hala"><a href="https://twitter.com/halae">HALA</a></div>
<canvas id="projector" width="100" height="100%">Your browser does not support the Canvas element.</canvas>
<script type="text/javascript">
		//
		// ORGINAL EXPERIMENT FROM http://hakim.se/experiments/html5/particles/01/	
		//
			var VELOCITY = 1;
			var PARTICLES = 400;
			
			//var mouse = {x:0, y:0};
			var particles = [];
			//var colors = [ "#D26","#fff000","#D26","#fff000","#fffcca", "#f989b2" ];
			var colors = [ "#8cc356","#6bab2d",/* "#ffcc00" */"#2dab98","#ddc922","#3597d0", "#d03568" ];
			var canvas = document.getElementById('projector');
			var context;


			if (canvas && canvas.getContext) {
				context = canvas.getContext('2d');
				
				for( var i = 0; i < PARTICLES; i++ ) {
					particles.push( { 
						x: Math.random()*window.innerWidth, 
						y: Math.random()*window.innerHeight, 
						vx: ((Math.random()*(VELOCITY*2))-VELOCITY),
						vy: ((Math.random()*(VELOCITY*2))-VELOCITY),
						size: 1+Math.random()*3,
						color: colors[ Math.floor( Math.random() * colors.length ) ]
					} );
				}
				
				Initialize();
			}
			
			function Initialize() {
 				window.addEventListener('resize', ResizeCanvas, false);
				setInterval( TimeUpdate, 40 );
				
				ResizeCanvas();
			}
			
			function TimeUpdate(e) {
				
				context.clearRect(0, 0, window.innerWidth, window.innerHeight);
				
				var len = particles.length;
				var particle;
				
				for( var i = 0; i < len; i++ ) {
					particle = particles[i];
					
					if (!particle.frozen) {
						particle.x += particle.vx;
						particle.y += particle.vy;
						
						if (particle.x > window.innerWidth) {
							particle.vx = -VELOCITY - Math.random();
						}
						else if (particle.x < 0) {
							particle.vx = VELOCITY + Math.random();
						}
						else {
							particle.vx *= 1 + (Math.random() * 0.005);
						}
						
						if (particle.y > window.innerHeight) {
							particle.vy = -VELOCITY - Math.random();
						}
						else if (particle.y < 0) {
							particle.vy = VELOCITY + Math.random();
						}
						else {
							particle.vy *= 1 + (Math.random() * 0.005);
						}
						
 						
						particle.currentSize = particle.size;
					}
					
					context.fillStyle = particle.color;
					context.beginPath();
					context.arc(particle.x,particle.y,particle.currentSize,0,Math.PI*2,true);
					context.closePath();
					context.fill();
					
				}
			}
 
			function ResizeCanvas(e) {
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
			}
			
			function DistanceBetween(p1,p2) {
				var dx = p2.x-p1.x;
				var dy = p2.y-p1.y;
				return Math.sqrt(dx*dx + dy*dy);
			}
		</script>
</body>
